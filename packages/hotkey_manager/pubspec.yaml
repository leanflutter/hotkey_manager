name: hotkey_manager
description: This plugin allows Flutter desktop apps to defines system/inapp wide hotkey (i.e. shortcut).
version: 0.2.3
homepage: https://github.com/leanflutter/hotkey_manager

platforms:
  linux:
  macos:
  windows:

topics:
  - hotkey
  - shortcuts
  - global-hotkey
  - global-shortcuts

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hotkey_manager_platform_interface: ^0.2.0
  nativeapi: ^0.5.4
  uni_platform: ^0.1.3
  uuid: '>=3.0.7 <5.0.0'

dev_dependencies:
  cnativeapi: ^0.5.4
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
      macos:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
      windows:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
