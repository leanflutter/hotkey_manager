name: hotkey_manager
description: System-wide desktop shortcuts and in-app hardware-keyboard shortcuts for Flutter desktop and Android apps.
version: 0.2.3
homepage: https://github.com/leanflutter/hotkey_manager

platforms:
  android:
  linux:
  macos:
  windows:

topics:
  - hotkey
  - shortcuts
  - global-hotkey
  - global-shortcuts

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  hotkey_manager_platform_interface: ^0.2.0
  nativeapi: ^0.5.6
  uni_platform: ^0.1.3
  uuid: '>=3.0.7 <5.0.0'

dev_dependencies:
  cnativeapi: ^0.5.6
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
      linux:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
      macos:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
      windows:
        dartPluginClass: NativeHotKeyManagerPlatform
        dartFileName: native.dart
