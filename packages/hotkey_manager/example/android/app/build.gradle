plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.hotkey_manager_example'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    testBuildType 'release'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.example.hotkey_manager_example'
        testInstrumentationRunner 'com.example.hotkey_manager_example.KeyboardProbeRunner'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    buildTypes {
        release {
            // This example uses a debug key for local release verification.
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
